<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications - Activity Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <div class="max-w-4xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid me-2 fa-bell text-indigo-400"></i> Notifications
          <span id="unread-count" class="text-xs bg-indigo-500/20 text-indigo-400 px-2.5 py-0.5 rounded-full font-semibold border border-indigo-500/30">
            3 unread
          </span>
        </h1>
        <p class="text-sm text-slate-400 mt-1">Track your sign-ins, security updates, and withdrawal transactions.</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="markAllAsRead()" class="text-xs font-medium text-slate-400 hover:text-indigo-400 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700/60 transition">
          <i class="fa-solid fa-check-double me-1"></i> Mark all read
        </button>
        <button onclick="clearAllNotifications()" class="text-xs font-medium text-rose-400 hover:text-rose-300 px-3 py-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 transition">
          <i class="fa-solid fa-trash-can me-1"></i> Clear all
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex items-center gap-2 my-6 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filterNotifications('all', this)" class="filter-btn active text-sm font-medium px-4 py-2 rounded-xl bg-indigo-600 text-white transition">
        All Activity
      </button>

      <button onclick="filterNotifications('withdrawal', this)" class="filter-btn text-sm font-medium px-4 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-slate-200 transition">
        Withdrawals
      </button>

      <button onclick="filterNotifications('signin', this)" class="filter-btn text-sm font-medium px-4 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-slate-200 transition">
        Sign-ins
      </button>

      <button onclick="filterNotifications('unread', this)" class="filter-btn text-sm font-medium px-4 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-slate-200 transition">
        Unread
      </button>
    </div>

    <!-- Notification List Container -->
    <div id="notifications-list" class="space-y-3">
      <!-- Items dynamically rendered or updated via JS -->
    </div>
  </div>

  <script>
    // Sample Notification Data
    let notifications = [
      {
        id: 1,
        type: "withdrawal",
        category: "success",
        title: "Withdrawal Completed",
        description: "Your withdrawal request of <strong>$1,250.00 USD</strong> to Bank Account ending in ****4821 has been processed successfully.",
        timestamp: "Aug 9, 2026 • 01:15 PM",
        isRead: false,
        txRef: "TXN-8849201"
      },
      {
        id: 2,
        type: "signin",
        category: "security",
        title: "New Sign-in Detected",
        description: "New login session initiated from <strong>Chrome on Windows (Ekpoma, NG)</strong>.",
        timestamp: "Aug 9, 2026 • 12:40 PM",
        isRead: false,
        ipAddress: "102.89.23.14"
      },
      {
        id: 3,
        type: "withdrawal",
        category: "pending",
        title: "Withdrawal Processing",
        description: "A withdrawal request for <strong>$350.00 USD</strong> is currently under review by compliance.",
        timestamp: "Aug 8, 2026 • 09:22 PM",
        isRead: false,
        txRef: "TXN-8849150"
      },
      {
        id: 4,
        type: "withdrawal",
        category: "failed",
        title: "Withdrawal Failed",
        description: "Payout of <strong>$80.00 USD</strong> was reversed due to invalid account routing parameters.",
        timestamp: "Aug 6, 2026 • 04:10 PM",
        isRead: true,
        txRef: "TXN-8848002"
      },
      {
        id: 5,
        type: "signin",
        category: "security",
        title: "Account Sign-in",
        description: "Successful login session recorded.",
        timestamp: "Aug 5, 2026 • 08:05 AM",
        isRead: true,
        ipAddress: "102.89.23.10"
      }
    ];

    let currentFilter = 'all';

    function getIcon(type, category) {
      if (type === 'withdrawal') {
        if (category === 'success') return { icon: 'fa-arrow-up-right-from-square', bg: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' };
        if (category === 'pending') return { icon: 'fa-clock', bg: 'bg-amber-500/10 text-amber-400 border-amber-500/20' };
        if (category === 'failed') return { icon: 'fa-triangle-exclamation', bg: 'bg-rose-500/10 text-rose-400 border-rose-500/20' };
      }
      if (type === 'signin') {
        return { icon: 'fa-shield-halved', bg: 'bg-sky-500/10 text-sky-400 border-sky-500/20' };
      }
      return { icon: 'fa-bell', bg: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20' };
    }

    function renderNotifications() {
      const container = document.getElementById('notifications-list');
      
      const filtered = notifications.filter(item => {
        if (currentFilter === 'unread') return !item.isRead;
        if (currentFilter === 'withdrawal') return item.type === 'withdrawal';
        if (currentFilter === 'signin') return item.type === 'signin';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-slate-800/40 rounded-2xl border border-slate-800">
            <i class="fa-regular fa-bell-slash text-4xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 font-medium">No notifications found</p>
            <p class="text-xs text-slate-500 mt-1">There is no activity matching your current selection.</p>
          </div>
        `;
        updateUnreadBadge();
        return;
      }

      container.innerHTML = filtered.map(item => {
        const style = getIcon(item.type, item.category);
        return `
          <div class="group relative flex gap-4 p-4 rounded-2xl border transition-all duration-200 ${
            item.isRead ? 'bg-slate-900/60 border-slate-800/80 opacity-80' : 'bg-slate-800/70 border-slate-700/80 shadow-lg shadow-indigo-950/20'
          }">
            
            <!-- Icon -->
            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border ${style.bg}">
              <i class="fa-solid ${style.icon} text-base"></i>
            </div>

            <!-- Content -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2 mb-1">
                <h3 class="text-sm font-semibold text-white flex items-center gap-2">
                  ${item.title}
                  ${!item.isRead ? '<span class="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span>' : ''}
                </h3>
                <span class="text-xs text-slate-400 shrink-0">${item.timestamp}</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed">${item.description}</p>
              
              <!-- Metadata Badges -->
              <div class="flex items-center gap-2 mt-2">
                ${item.txRef ? `<span class="text-[11px] font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">Ref: ${item.txRef}</span>` : ''}
                ${item.ipAddress ? `<span class="text-[11px] font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">IP: ${item.ipAddress}</span>` : ''}
              </div>
            </div>

            <!-- Actions -->
            <div class="flex flex-col justify-between items-end gap-2 shrink-0">
              <button onclick="toggleRead(${item.id})" title="${item.isRead ? 'Mark as unread' : 'Mark as read'}" class="text-slate-500 hover:text-indigo-400 transition text-sm">
                <i class="fa-solid ${item.isRead ? 'fa-envelope' : 'fa-envelope-open'}"></i>
              </button>
              <button onclick="deleteNotification(${item.id})" title="Delete notification" class="text-slate-500 hover:text-rose-400 transition text-xs opacity-0 group-hover:opacity-100">
                <i class="fa-solid fa-xmark text-sm"></i>
              </button>
            </div>

          </div>
        `;
      }).join('');

      updateUnreadBadge();
    }

    function filterNotifications(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-slate-400');
      });
      btn.classList.remove('bg-slate-800', 'text-slate-400');
      btn.classList.add('bg-indigo-600', 'text-white');
      renderNotifications();
    }

    function toggleRead(id) {
      notifications = notifications.map(item => 
        item.id === id ? { ...item, isRead: !item.isRead } : item
      );
      renderNotifications();
    }

    function markAllAsRead() {
      notifications = notifications.map(item => ({ ...item, isRead: true }));
      renderNotifications();
    }

    function clearAllNotifications() {
      notifications = [];
      renderNotifications();
    }

    function deleteNotification(id) {
      notifications = notifications.filter(item => item.id !== id);
      renderNotifications();
    }

    function updateUnreadBadge() {
      const count = notifications.filter(n => !n.isRead).length;
      const badge = document.getElementById('unread-count');
      badge.textContent = `${count} unread`;
      if (count === 0) {
        badge.classList.add('hidden');
      } else {
        badge.classList.remove('hidden');
      }
    }

    // Initial render
    renderNotifications();
  </script>
</body>
</html>
