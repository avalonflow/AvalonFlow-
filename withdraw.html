<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvalonFlow - Transaction Review</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #8a99ad;
            --accent-purple: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.3);
            --green-success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Ambient Orbs */
        .bg-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.4;
        }
        .orb-1 {
            top: -10%;
            left: -10%;
            background: var(--accent-purple);
        }
        .orb-2 {
            bottom: -10%;
            right: -10%;
            background: #2563eb;
        }

        .container {
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        /* Premium Glassmorphism Card */
        .transaction-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .divider {
            border: none;
            height: 1px;
            background: var(--card-border);
            margin-bottom: 24px;
        }

        /* Conversion Interface Elements */
        .conversion-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            margin-bottom: 24px;
        }

        .amount-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
        }

        .amount-box.highlight {
            border-color: rgba(124, 58, 237, 0.4);
            background: rgba(124, 58, 237, 0.05);
        }

        .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value-display {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .currency-tag {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-left: auto;
            font-weight: 500;
        }

        .conversion-arrow {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent-purple);
            border: 4px solid var(--bg-dark);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .conversion-arrow svg {
            width: 14px;
            height: 14px;
            stroke: white;
        }

        /* Metadata List styling */
        .details-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.01);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-value {
            font-weight: 500;
        }

        .font-gradient {
            background: linear-gradient(45deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fee-free {
            color: var(--green-success);
            font-weight: 600;
        }

        /* Security Note */
        .security-note {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .security-note svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-secondary);
            flex-shrink: 0;
        }

        /* Primary Form Action Button */
        .btn-primary {
            width: 100%;
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            background: #6d28d9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <div class="transaction-card">
            <div class="card-header">
                <h2>Review Transaction</h2>
                <div id="region-badge" class="badge">
                    <span id="badge-flag"></span>
                    <span id="badge-text">Processing Gateway</span>
                </div>
            </div>

            <hr class="divider">

            <div class="conversion-container">
                <div class="amount-box">
                    <span class="label">You Send</span>
                    <div class="value-display">$ <span id="send-amount">1,000.00</span> <span class="currency-tag">USD</span></div>
                </div>

                <div class="conversion-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                </div>

                <div class="amount-box highlight">
                    <span class="label">They Receive (Estimated)</span>
                    <div class="value-display"><span id="receive-symbol">£</span> <span id="receive-amount">0.00</span> <span id="receive-currency" class="currency-tag">GBP</span></div>
                </div>
            </div>

            <div class="details-list">
                <div class="detail-item">
                    <span class="detail-label">Guaranteed Rate</span>
                    <span id="live-rate" class="detail-value">Calculating...</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Estimated Arrival</span>
                    <span id="arrival-time" class="detail-value font-gradient">Calculating...</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Transfer Method</span>
                    <span id="payout-method" class="detail-value">Checking configuration...</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Network Fee</span>
                    <span class="detail-value fee-free">Free</span>
                </div>
            </div>

            <div class="security-note">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Secured via intercompany automated asset routing system.</span>
            </div>

            <button id="confirm-btn" class="btn-primary">Confirm & Authorize Disbursement</button>
        </div>
    </div>

    <script>
        // Mock Session Storage retrieval simulation from your previous state
        const mockPreviousFormState = {
            region: "UK", // Values will switch dynamically between 'UK' or 'CA' 
            selectedAssetOrBank: "NatWest",
            baseAmountUSD: 1250.00
        };

        // Configuration mappings for dynamic regions
        const regionConfig = {
            UK: {
                flag: "🇬🇧",
                text: "United Kingdom",
                currency: "GBP",
                symbol: "£",
                baseRateVsUSD: 0.78, // 1 USD = 0.78 GBP
                eta: "Instant via Faster Payments"
            },
            CA: {
                flag: "🇨🇦",
                text: "Canada",
                currency: "CAD",
                symbol: "$",
                baseRateVsUSD: 1.36, // 1 USD = 1.36 CAD
                eta: "1-2 hours via Interac"
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            renderTransactionSummary(mockPreviousFormState);
        });

        function renderTransactionSummary(sessionData) {
            const config = regionConfig[sessionData.region];
            if (!config) return;

            // 1. Update Layout Header & Badges
            document.getElementById("badge-flag").innerText = config.flag;
            document.getElementById("badge-text").innerText = config.text;
            document.getElementById("payout-method").innerText = `${sessionData.selectedAssetOrBank}`;

            // 2. Set static initial values
            const usdSend = sessionData.baseAmountUSD;
            document.getElementById("send-amount").innerText = usdSend.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            // 3. Set Destination Currency Symbols
            document.getElementById("receive-symbol").innerText = config.symbol;
            document.getElementById("receive-currency").innerText = config.currency;
            document.getElementById("arrival-time").innerText = config.eta;

            // 4. Simulate Live Micro-Fluctuations (Real-Time Conversion Rates)
            function updateExchangeRate() {
                // Adds tiny random variations to mock a real web socket API tick
                const volatility = (Math.random() - 0.5) * 0.002; 
                const liveRate = config.baseRateVsUSD + volatility;
                
                const finalCalculatedReceive = usdSend * liveRate;

                // Render live changes smoothly
                document.getElementById("live-rate").innerText = `1 USD = ${liveRate.toFixed(4)} ${config.currency}`;
                document.getElementById("receive-amount").innerText = finalCalculatedReceive.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            // Initial calculation run
            updateExchangeRate();

            // Interval to refresh rates every 3.5 seconds
            const rateTickerInterval = setInterval(updateExchangeRate, 3500);

            // Handle Confirm Event Action
            document.getElementById("confirm-btn").addEventListener("click", () => {
                clearInterval(rateTickerInterval);
                alert(`Disbursement authorized via ${sessionData.selectedAssetOrBank} Gateway!`);
            });
        }
    </script>
</body>
</html>
